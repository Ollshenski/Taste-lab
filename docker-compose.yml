# Production: the shop behind Caddy, which gets and renews HTTPS certificates
# for $DOMAIN automatically. Fill in .env (see .env.example), then:
#   docker compose up -d --build
services:
  app:
    build: .
    env_file: .env
    volumes:
      - shop-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2.8
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  shop-data:
  caddy-data:
